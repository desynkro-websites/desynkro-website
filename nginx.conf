server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    charset utf-8;

    # ── COMPRESSION ──
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json
               application/ld+json application/xml image/svg+xml;

    # ── SECURITY HEADERS ──
    # Inherited by any location that does not define its own add_header.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=(), fullscreen=(self \"https://www.youtube.com\")" always;
    add_header Strict-Transport-Security "max-age=7776000" always;

    # ── HIDE REPO INTERNALS ──
    # Dotfiles/dotdirs, but keep .well-known (security.txt) reachable.
    location ~ /\.(?!well-known) {
        deny all;
    }
    location ~* ^/(README\.md|CHANGELOG\.md|LICENSE|docker-compose\.yml|nginx\.conf)$ {
        deny all;
    }
    location ^~ /screenshots/ {
        deny all;
    }

    # ── STATIC ASSETS ──
    # Long cache. URLs are versioned with ?v=YYYYMMDD, so this is safe.
    location ~* \.(jpg|jpeg|png|gif|webp|svg|ico|css|js|mp4|webm|woff2?|ttf|eot)$ {
        try_files $uri =404;
        expires 30d;
    }

    # ── HTML ──
    # Always revalidate so a new release is picked up without a CDN purge.
    location = / {
        try_files /index.html =404;
        expires -1;
    }

    # /portfolio is a directory (contains images), handle explicitly
    # to prevent nginx from adding a trailing slash redirect.
    location = /portfolio {
        try_files /portfolio.html =404;
        expires -1;
    }

    # SPA fallback for deep portfolio routes, also revalidated.
    location / {
        try_files $uri /portfolio.html;
        expires -1;
    }
}
