server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Static assets — long cache, fallback to portfolio for SPA
    location ~* \.(jpg|jpeg|png|gif|webp|svg|ico|css|js|mp4|webm|woff2?|ttf|eot)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Home page
    location = / {
        try_files /index.html =404;
    }

    # Portfolio — /portfolio is a directory (contains images), so handle explicitly
    # to prevent nginx from adding a trailing slash redirect
    location = /portfolio {
        try_files /portfolio.html =404;
    }

    # All other routes — SPA fallback to portfolio.html
    location / {
        try_files $uri /portfolio.html;
    }
}
